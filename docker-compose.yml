services:
  db:
    image: postgres:16.10-alpine
    container_name: postgres
    restart: no
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-testing}
      POSTGRES_USER: ${POSTGRES_USER:-testing}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-testing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  seaweedfs:
    image: chrislusf/seaweedfs:3.98
    container_name: seaweedfs
    restart: no
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3secret}
      WEED_S3_SSE_KEY: ${SEAWEEDFS_SSE_KEY}
    ports:
      - "9000:9000"
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=0; wget -q -O /dev/null http://127.0.0.1:9000/ || code=$$?; test $$code -eq 0 -o $$code -eq 1 -o $$code -eq 8"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.port=9333
      - -volume.port=8080
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.ip.bind=0.0.0.0
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024

  createbuckets:
    image: amazon/aws-cli:2.27.41
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-s3admin}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-s3secret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://seaweedfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done &&
        aws --endpoint-url http://seaweedfs:9000 s3api head-bucket --bucket law-firm-files 2>/dev/null || aws --endpoint-url http://seaweedfs:9000 s3api create-bucket --bucket law-firm-files &&
        aws --endpoint-url http://seaweedfs:9000 s3api put-bucket-encryption --bucket law-firm-files --server-side-encryption-configuration '{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"AES256\"}}]}' &&
        echo 'Bucket law-firm-files created successfully'
      "

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: mailpit
    restart: no
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres_data:
  seaweedfs_data:
