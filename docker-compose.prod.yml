x-image: &app-image ghcr.io/four4bytes/law-firm-management-system:latest

services:
  db:
    image: postgres:16.10-alpine
    container_name: postgres-prod
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    expose:
      - "5432"

  migrate:
    image: *app-image
    container_name: prisma-migrate
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    env_file: .env.prod
    environment:
      NODE_ENV: production
    command: ["pnpm", "prisma", "migrate", "deploy"]

  seaweedfs:
    image: chrislusf/seaweedfs:3.99
    container_name: seaweedfs-prod
    restart: unless-stopped
    env_file: .env.prod
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      WEED_S3_SSE_KEK: ${SEAWEEDFS_SSE_KEK}
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "code=0; wget -q -O /dev/null http://127.0.0.1:9000/ || code=$$?; test $$code -eq 0 -o $$code -eq 1 -o $$code -eq 8"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=0.0.0.0
      - -master.port=9333
      - -volume.port=8080
      - -filer
      - -s3
      - -s3.port=9000
      - -s3.ip.bind=0.0.0.0
      - -volume.max=0
      - -master.volumeSizeLimitMB=1024
    expose:
      - "9000"

  createbuckets:
    image: amazon/aws-cli:2.27.41
    depends_on:
      seaweedfs:
        condition: service_healthy
    env_file: .env.prod
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION}
      AWS_EC2_METADATA_DISABLED: "true"
      S3_CORS_ALLOWED_ORIGINS: ${S3_CORS_ALLOWED_ORIGINS}
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://seaweedfs:9000 s3api list-buckets >/dev/null 2>&1; do sleep 2; done &&
        aws --endpoint-url http://seaweedfs:9000 s3api head-bucket --bucket law-firm-files 2>/dev/null || aws --endpoint-url http://seaweedfs:9000 s3api create-bucket --bucket law-firm-files &&
        aws --endpoint-url http://seaweedfs:9000 s3api put-bucket-encryption --bucket law-firm-files --server-side-encryption-configuration '{\"Rules\":[{\"ApplyServerSideEncryptionByDefault\":{\"SSEAlgorithm\":\"AES256\"}}]}' &&
        aws --endpoint-url http://seaweedfs:9000 s3api put-bucket-cors --bucket law-firm-files --cors-configuration '{\"CORSRules\":[{\"AllowedOrigins\":[\"'"$$S3_CORS_ALLOWED_ORIGINS"'\"],\"AllowedMethods\":[\"GET\",\"PUT\",\"HEAD\"],\"AllowedHeaders\":[\"*\"],\"ExposeHeaders\":[\"ETag\"],\"MaxAgeSeconds\":3600}]}' &&
        echo 'Bucket law-firm-files created successfully'
      "

  web:
    image: *app-image
    container_name: nextjs-prod
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      createbuckets:
        condition: service_completed_successfully
    env_file: .env.prod
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      AUTH_TRUST_HOST: true
      AUTH_URL: http://localhost:3000
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  seaweedfs_data:
