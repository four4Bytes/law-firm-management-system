changelog:
  exclude:
    labels:
      - skip-release
    authors:
      - github-actions[bot]
      - dependabot[bot]

  categories:
    - title: "🚀 New Features"
      labels:
        - feature
        - feat

    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix

    - title: "🧰 Maintenance & CI"
      labels:
        - chore
        - ci
        - refactor

    - title: "📦 Dependency Updates"
      labels:
        - dependencies
