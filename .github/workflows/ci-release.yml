name: CI & Release

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Cache ESLint
        uses: actions/cache@v5
        with:
          path: node_modules/.cache/.eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.*') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('**/*.{js,jsx,ts,tsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('pnpm-lock.yaml') }}-

      - run: pnpm validate

      - run: pnpm test

      - run: pnpm build

  release:
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.calver.outputs.tag }}
      version: ${{ steps.calver.outputs.version }}
    permissions:
      contents: write
    steps:
      - name: Generate Bot Token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.bot-token.outputs.token }}

      - name: Generate CalVer version
        id: calver
        run: |
          DATE_TAG="v$(date +'%Y.%m.%d')"
          LAST=$(git tag -l "${DATE_TAG}.*" | sort -V | tail -1)
          if [ -z "$LAST" ]; then
            PATCH=0
          else
            PATCH=$(( ${LAST##*.} + 1 ))
          fi
          TAG="${DATE_TAG}.${PATCH}"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Sync package.json version
        if: steps.calver.outputs.version != ''
        env:
          VERSION: ${{ steps.calver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm pkg set version="$VERSION"
          git add package.json
          git commit -m "chore: bump package.json to $VERSION [skip ci]"

      - name: Push version sync commit
        if: steps.calver.outputs.version != ''
        run: git push

      - name: Create CalVer tag and release
        if: steps.calver.outputs.version != ''
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }} # Use the bot token here
          TAG: ${{ steps.calver.outputs.tag }}
        run: |
          COMMIT_SHA=$(git rev-parse HEAD)

          # Fetch the native release notes targeting the "dev" branch (finds feature -> dev PRs)
          gh api repos/${{ github.repository }}/releases/generate-notes \
            -f tag_name="$TAG" \
            -f target_commitish="dev" \
            --jq .body > changelog.md

          # Create the release on "main" targeting the resolved main commit SHA
          gh release create "$TAG" \
            --notes-file changelog.md \
            --target "$COMMIT_SHA" \
            --title "$TAG"

  docker:
    needs: release
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.repo.outputs.name }}
          tags: |
            type=raw,value=${{ needs.release.outputs.tag }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_VERSION=${{ needs.release.outputs.version }}
