name: Skip Changelog

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  skip-changelog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Add skip-changelog label for release PRs from dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TITLE: ${{ github.event.pull_request.title }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [[ "$BASE_REF" != "main" || "$HEAD_REF" != "dev" ]]; then
            echo "Not dev -> main (base=$BASE_REF head=$HEAD_REF), skipping."
            exit 0
          fi

          if ! echo "$TITLE" | grep -qi "release"; then
            echo "Title does not contain 'release' (title=$TITLE), skipping."
            exit 0
          fi

          echo "Release PR detected (#$PR_NUMBER: $TITLE), adding skip-changelog label."

          gh label create "release" --repo "$REPO" \
            --color "0e8a16" \
            --description "Release pull pull request" 2>/dev/null || true

          gh label create "skip-changelog" --repo "$REPO" \
            --color "ededed" \
            --description "Exclude from changelog" 2>/dev/null || true

          gh pr edit "$PR_NUMBER" --repo "$REPO" --add-label "skip-changelog" --add-label "release"
